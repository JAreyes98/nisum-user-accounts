spring:
  application:
    name: accountsapi

  datasource:
    url: jdbc:h2:mem:testdb_${random.uuid};DB_CLOSE_DELAY=0;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /account/api


